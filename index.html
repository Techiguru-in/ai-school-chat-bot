```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groq AI Chat</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }

    #response {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>Groq AI Assistant</h1>

  <textarea id="question" placeholder="Ask something..."></textarea>

  <br>

  <button onclick="askGroq()">Ask AI</button>

  <div id="response">AI response will appear here...</div>

  <script>
    const GROQ_API_KEY = "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";

    async function askGroq() {
      const question = document.getElementById("question").value.trim();
      const responseBox = document.getElementById("response");

      if (!question) {
        responseBox.textContent = "Please enter a question.";
        return;
      }

      responseBox.textContent = "Thinking...";

      try {
        const response = await fetch(
          "https://api.groq.com/openai/v1/chat/completions",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${GROQ_API_KEY}`
            },

            body: JSON.stringify({
              model: "openai/gpt-oss-20b",

              messages: [
                {
                  role: "system",
                  content: "You are a helpful AI assistant. Give clear and simple answers."
                },
                {
                  role: "user",
                  content: question
                }
              ],

              temperature: 0.5,
              max_completion_tokens: 1024
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data?.error?.message || `API Error: ${response.status}`
          );
        }

        const answer =
          data?.choices?.[0]?.message?.content;

        responseBox.textContent =
          answer || "No response received.";

      } catch (error) {
        console.error(error);

        responseBox.textContent =
          "Error: " + error.message;
      }
    }
  </script>

</body>
</html>
